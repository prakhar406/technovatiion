<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Persona Engine</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .badge {
      display: inline-block;
      background: #1e1b4b;
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #3730a3;
      margin-bottom: 12px;
    }
    h1 { color: #f0f6fc; font-size: 2rem; margin-top: 0; }
    p.subtitle { color: #8b949e; margin-bottom: 24px; }

    .box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    h3 {
      margin-top: 0;
      color: #f0f6fc;
      font-size: 1.1rem;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input, select {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 10px 14px;
      border-radius: 6px;
      flex: 1;
      font-size: 0.95rem;
      outline: none;
    }

    select {
      cursor: pointer;
    }

    select option {
      background: #161b22;
      color: #f0f6fc;
    }

    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    button.btn-refresh {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }

    button.btn-refresh:hover {
      background: #30363d;
      color: #f0f6fc;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .agent-status {
      font-family: monospace;
      color: #58a6ff;
      background: #0d1117;
      padding: 8px 12px;
      border-radius: 6px;
      word-break: break-all;
      margin-top: 10px;
      display: none;
    }

    /* Feed Card Styles */
    .post-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      color: #8b949e;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .post-id { font-family: monospace; color: #58a6ff; }
    .post-text { font-size: 1.05rem; line-height: 1.5; color: #f0f6fc; margin-bottom: 16px; }

    .rationale-box {
      background: #0d1117;
      border-left: 3px solid #238636;
      padding: 12px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .rationale-title {
      color: #3fb950;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sources { font-size: 0.85rem; color: #8b949e; }
    .sources a { color: #58a6ff; text-decoration: none; }
    .sources a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="badge">✦ Autonomous Persona Engine</div>
  <h1>Autonomous Persona Engine</h1>
  <p class="subtitle">Initialize an agent once, then monitor its autonomous feed updates over time.</p>

  <!-- Step 1: Init Panel -->
  <div class="box">
    <h3>Initialize Agent</h3>
    <div class="form-group">
      <input type="text" id="personaName" value="Ada" placeholder="Agent Name (e.g., Ada)" />
      
      <select id="personaDomain">
        <option value="AI Security" selected>AI Security</option>
        <option value="Autonomous Agents">Autonomous Agents</option>
        <option value="Robotics & Hardware">Robotics & Hardware</option>
        <option value="LLM Infrastructure">LLM Infrastructure</option>
        <option value="Cybersecurity">Cybersecurity</option>
        <option value="Quantum Computing">Quantum Computing</option>
      </select>

      <button id="initBtn" onclick="initAgent()">Initialize Agent</button>
    </div>
    <div id="initResult" class="agent-status"></div>
  </div>

  <!-- Step 2: Feed Query Panel -->
  <div class="box">
    <h3>Retrieve Feed</h3>
    <div class="form-group">
      <input type="text" id="feedAgentId" placeholder="Paste Agent ID here..." />
      <button onclick="loadFeed()">Fetch Feed</button>
      <button class="btn-refresh" onclick="loadFeed()">↻ Refresh</button>
    </div>
  </div>

  <!-- Posts Output -->
  <div id="feedOutput"></div>

  <script>
    async function initAgent() {
      const name = document.getElementById('personaName').value.trim();
      const domain = document.getElementById('personaDomain').value;
      const resultDiv = document.getElementById('initResult');
      const initBtn = document.getElementById('initBtn');

      if (!name || !domain) return alert('Please specify name and domain.');

      initBtn.disabled = true;
      resultDiv.style.display = 'block';
      resultDiv.innerText = 'Initializing agent & generating autonomous timeline...';

      try {
        const res = await fetch('/api/agent/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ persona: { name, domain } })
        });

        const data = await res.json();
        initBtn.disabled = false;

        if (!res.ok) throw new Error(data.error || 'Failed to initialize agent.');

        resultDiv.innerHTML = `<strong>Status:</strong> Active<br><strong>Agent ID:</strong> ${data.agentId}`;
        document.getElementById('feedAgentId').value = data.agentId;
        
        loadFeed();

      } catch (err) {
        resultDiv.innerText = `Error: ${err.message}`;
        initBtn.disabled = false;
      }
    }

    async function loadFeed() {
      const agentId = document.getElementById('feedAgentId').value.trim();
      const output = document.getElementById('feedOutput');

      if (!agentId) return alert('Enter an Agent ID to query feed.');

      output.innerHTML = '<p style="color:#8b949e;">Fetching feed updates...</p>';

      try {
        const res = await fetch(`/api/agent/feed?agentId=${encodeURIComponent(agentId)}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed to fetch feed.');

        if (!data.posts || data.posts.length === 0) {
          output.innerHTML = '<div class="box"><p>No posts available in feed yet.</p></div>';
          return;
        }

        output.innerHTML = data.posts.map(post => `
          <div class="post-card">
            <div class="post-header">
              <span class="post-id">ID: ${post.id}</span>
              <span>${new Date(post.createdAt).toLocaleString()}</span>
            </div>
            <div class="post-text">${post.text}</div>
            <div class="rationale-box">
              <div class="rationale-title">Publishing Rationale</div>
              <div>${post.rationale}</div>
            </div>
            <div class="sources">
              <strong>Sources:</strong> 
              ${(post.sources || []).map(s => `<a href="${s}" target="_blank">${s}</a>`).join(', ')}
            </div>
          </div>
        `).join('');

      } catch (err) {
        output.innerHTML = `<div class="box" style="color:#f85149;">Error: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
