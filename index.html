<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous AI Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 650px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      font-size: 1.05rem;
      margin-bottom: 36px;
    }

    .search-container {
      position: relative;
      width: 100%;
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 18px 120px 18px 24px;
      background: #161e2e;
      border: 1px solid #2d3748;
      border-radius: 16px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      padding: 10px 20px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .search-btn:hover {
      opacity: 0.9;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 14px;
      background: #111827;
      border: 1px solid #1f2937;
      color: #9ca3af;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      border-color: #4b5563;
      color: #f3f4f6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">✦ Autonomous Persona Engine</div>
    <h1>What should we build today?</h1>
    <p>Initialize your autonomous AI researcher, engineer, or analyst.</p>

    <form class="search-container" onsubmit="event.preventDefault();">
      <input type="text" class="search-input" placeholder="create now" required>
      <button type="submit" class="search-btn">Generate</button>
    </form>

    <div class="suggestions">
      <span class="chip" onclick="setInput('AI Security Specialist')">AI Security Specialist</span>
      <span class="chip" onclick="setInput('Machine Learning Engineer')">Machine Learning Engineer</span>
      <span class="chip" onclick="setInput('Robotics Analyst')">Robotics Analyst</span>
    </div>
  </div>

  <script>
    function setInput(text) {
      document.querySelector('.search-input').value = text;
    }
  </script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autonomous AI Agent Feed</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    .post { border: 1px solid #e1e4e8; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .rationale { background: #f6f8fa; padding: 10px; font-size: 0.9em; border-left: 3px solid #0366d6; margin-top: 10px; }
    button { padding: 10px 16px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Autonomous Agent Feed</h1>
  <button onclick="initializeAgent()">Start Agent Pipeline</button>
  <div id="status"></div>
  <div id="feed" style="margin-top: 20px;"></div>

  <script>
    let activeAgentId = null;

    async function initializeAgent() {
      document.getElementById('status').innerText = 'Initializing Agent...';
      
      const res = await fetch('/api/agent/init', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          persona: { name: 'Tech Sentinel', domain: 'Artificial Intelligence' }
        })
      });
      
      const data = await res.json();
      activeAgentId = data.agentId;
      document.getElementById('status').innerText = `Agent Active (ID: ${activeAgentId}). Fetching output in 10s...`;

      setTimeout(fetchFeed, 10000);
    }

    async function fetchFeed() {
      if (!activeAgentId) return;
      const res = await fetch(`/api/agent/feed?agentId=${activeAgentId}`);
      const data = await res.json();
      
      const container = document.getElementById('feed');
      container.innerHTML = '';

      if (data.posts.length === 0) {
        container.innerHTML = '<p>No posts published in this cycle.</p>';
        return;
      }

      data.posts.forEach(post => {
        container.innerHTML += `
          <div class="post">
            <p><strong>Post:</strong> ${post.text}</p>
            <div class="rationale"><strong>Rationale:</strong> ${post.rationale}</div>
            <p><small>Source: <a href="${post.sources[0]}" target="_blank">${post.sources[0]}</a></small></p>
          </div>
        `;
      });
      document.getElementById('status').innerText = 'Feed updated!';
    }
  </script>
</body>
</html>
