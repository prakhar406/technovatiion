<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autonomous Persona Engine</title>
  <style>
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .badge {
      background: #1e1b4b;
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid #3730a3;
      margin-bottom: 16px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 8px; }
    p { color: #9ca3af; margin-bottom: 24px; }
    
    .input-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      width: 450px;
    }
    input {
      background: transparent;
      border: none;
      color: white;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      font-size: 1rem;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status { margin-top: 16px; color: #a5b4fc; }
    #output { margin-top: 24px; max-width: 600px; width: 100%; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 16px; border-radius: 8px; margin-top: 12px; }
    .rationale { background: #0d1117; border-left: 3px solid #6366f1; padding: 8px 12px; margin-top: 10px; font-size: 0.9em; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="badge">✦ Autonomous Persona Engine</div>
  <h1>What should we build today?</h1>
  <p>Initialize your autonomous AI researcher, engineer, or analyst.</p>

  <div class="input-box">
    <input type="text" id="personaInput" value="Robotics Analyst" placeholder="Enter domain or role..." />
    <button id="generateBtn" onclick="handleGenerate()">Generate</button>
  </div>

  <div id="status"></div>
  <div id="output"></div>

  <script>
    async function handleGenerate() {
      const input = document.getElementById('personaInput').value.trim();
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      const btn = document.getElementById('generateBtn');

      if (!input) {
        alert('Please enter a role or domain.');
        return;
      }

      btn.disabled = true;
      status.innerText = `Initializing agent for "${input}"...`;
      output.innerHTML = '';

      try {
        const initRes = await fetch('/api/agent/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            persona: { name: input, domain: input }
          })
        });

        const initData = await initRes.json();
        if (!initRes.ok) throw new Error(initData.error || 'Failed to initialize agent.');

        const agentId = initData.agentId;
        status.innerText = `Agent initialized (ID: ${agentId}). Generating feed in 8s...`;

        setTimeout(() => fetchFeed(agentId), 8000);

      } catch (err) {
        status.innerText = `Error: ${err.message}`;
        btn.disabled = false;
      }
    }

    async function fetchFeed(agentId) {
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      const btn = document.getElementById('generateBtn');

      try {
        const res = await fetch(`/api/agent/feed?agentId=${agentId}`);
        const data = await res.json();
        btn.disabled = false;

        if (!data.posts || data.posts.length === 0) {
          status.innerText = 'Evaluation complete. No topics met editorial criteria in this run.';
          return;
        }

        status.innerText = 'Generation complete!';
        output.innerHTML = data.posts.map(post => `
          <div class="card">
            <p><strong>Post:</strong> ${post.text}</p>
            <div class="rationale"><strong>Rationale:</strong> ${post.rationale}</div>
            ${post.sources && post.sources[0] ? `<p><small><a href="${post.sources[0]}" target="_blank" style="color:#818cf8;">Source Link</a></small></p>` : ''}
          </div>
        `).join('');

      } catch (err) {
        status.innerText = `Error fetching feed: ${err.message}`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
